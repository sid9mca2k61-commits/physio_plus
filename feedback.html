<!DOCTYPE html>
<html>
<head>
  <title>Customer Feedback</title>

  <style>
   
body {
 margin: 0;
  min-height: 100vh;
  background-color: blue;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  color: beige;
  
}


h2 {
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  font-size: x-large;
  font-weight: 500;
  text-align: center;
}


.FORM_BODY {
  width: 100%;
  max-width: 550px;
  background: linear-gradient(to right, blue, #2563EB, #06A5FA);
  padding: 10px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
  margin-top: 20px;
}

.FORM_BODY button {
    background: beige;
    border: black;
    border-radius: 6px;
    align-items: center;
    width: 50%;
    cursor: pointer;
    display: block;
    padding: 12px;
    color: blue;
    font-weight: bold;
    margin: 20px auto;
}

.logo{
  display: block;
  margin: 0 auto 10px;
  width: 100%;
  height: 5%;
  object-fit: contain;
}

.FORM_BODY label{
display: block;
align-items: center;
margin: 20px auto;
justify-content: center;
}


 input,
    textarea {
      width: 70%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      display: block;
      align-items: center;
      justify-content: center;
    }

    
  </style>
</head>

<body>

<div class="FORM_BODY">

<img src="Clinic_Logo.png" alt="Clinic_Logo" class="logo">

<h2> PHYSIO PLUS - PHYSIOTHERAPY CLINIC</h2>
<br><br><br>

<label>Customer Name</label>
<input type="text" id="Customer_Name" placeholder="Enter Customer Name">

<br>
<label>Customer Number</label>
<input type="text" id="Customer_Number" placeholder="Enter Customer Number">

<br>
<label>Select Appointment Date</label>
<input type = "date" id = "Appointment_Date" required>
<p id = "datemessage"></p>

<br>
<label>Feedback</label>
<textarea id = "Feedback" name="Feedback" placeholder="Enter Your Feedback Here"></textarea>

<br>
<button onclick="SUBMIT_FEEDBACK()">
  SUBMIT FEEDBACK
</button>

<button onclick="BACK()">
  BACK
</button>
<p id = "message"></p>
</div>
  
  <script>
   function BACK() {
    window.location.href = "book_appointment.html";


}
  </script>

</body>
</html>
