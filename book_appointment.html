<!DOCTYPE html>
<html>
<head>
  <title>Customer Feedback</title>

  <style>

    body {
 margin: 0;
  min-height: 100vh;
  background-color: blue;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  color: beige;
  
}


h2 {
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  font-size: x-large;
  font-weight: 500;
  text-align: center;
}


.FORM_BODY {
  width: 100%;
  max-width: 550px;
  background: linear-gradient(to right, blue, #2563EB, #06A5FA);
  padding: 10px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
  margin-top: 20px;
}

.FORM_BODY button {
    background: beige;
    border: black;
    border-radius: 6px;
    align-items: center;
    width: 50%;
    cursor: pointer;
    display: block;
    padding: 12px;
    color: blue;
    font-weight: bold;
    margin: 20px auto;
}

.logo{
  display: block;
  margin: 0 auto 10px;
  width: 100%;
  height: 5%;
  object-fit: contain;
}

.FORM_BODY label{
display: block;
align-items: center;
margin: 20px auto;
justify-content: center;
}


 input,
    textarea {
      width: 70%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      display: block;
      align-items: center;
      justify-content: center;
    }


  </style>
</head>

<body>
<div class="FORM_BODY">

<img src="Clinic_Logo.png" alt="Clinic_Logo" class="logo">

<h2> PHYSIO PLUS - PHYSIOTHERAPY CLINIC</h2>
<br><br><br>

<label>Customer Name</label>
<input type="text" id="Customer_Name" placeholder="Enter Customer Name">

<br>
<label>Customer Number</label>
<input type="text" id="Customer_Number" placeholder="Enter Customer Number">

<br>
<label>Select Appointment Date</label>
<input type = "date" id = "Appointment_Date" required>
<p id = "datemessage"></p>

<br>
<label>Select Visit Time</label>
<input type="time" id="Visit_time" name="Visit_time" 
    min="09:30" max="13:00" required>
 <p id = "message1"></p>

<br>
<button onclick="BOOK_APPOINTMENT()">
  BOOK APPOINTMENT
</button>

<button onclick="BACK()">
  BACK
</button>
<p id = "message"></p>
</div>
 
  <script>

function BACK() {
    window.location.href = "index.html";
}


    
function BOOK_APPOINTMENT() {

    const Customer_Name =
        document.getElementById('Customer_Name').value.trim();

    const Customer_Number =
        document.getElementById('Customer_Number').value.trim();

    const Appointment_Date =
        document.getElementById('Appointment_Date').value.trim();

    const Visit_time =
        document.getElementById('Visit_time').value.trim();

    // Check fields
    if (!Customer_Name || !Customer_Number || !Appointment_Date ||!Visit_time) {

        document.getElementById('message').innerText =
            'Please complete all fields.';

        return;
    }

 const S_day = new Date(Appointment_Date.value + "T00:00:00");
  
if(S_day.getDay() === 0)
{
datemessage.innerText = "Sunday Not Avaiable. Please select another Day";
datemessage.style.color = "red";
return;
}
else 
datemessage.innerText="";



 if (Visit_time < "09:30" || Visit_time > "13:00") {
    message1.innerText = "Please select a time between 9:30 AM and 1:00 PM.";
    message1.style.color = "red";
    return;
  }
else 
message1.innerText = "";
    // Data
    const data = {
        Customer_Name: Customer_Name,
        Customer_Number: Customer_Number,
        Appointment_Date: Appointment_Date,
        Visit_time : Visit_time
    };

    // Google Apps Script URL
    fetch("https://script.google.com/macros/s/AKfycbxqjHenfzs_DZygwGdSe8QgiYB5mR2jGVq0_MG75_IReGHbkp4TEvgZLamWWGPmCID_5g/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })

    .then(() => {

        document.getElementById('message').innerText =
            'Thank you! Your Appointmnet Confirmed. We will get back to you shortly';

        // Clear fields
        document.getElementById('Customer_Name').value = '';
        document.getElementById('Customer_Number').value = '';
        document.getElementById('Appointment_Date').value = '';
        document.getElementById('Visit_time').value = '';

    })

    .catch(error => {
        message1.innerText = ""
        console.error('FULL ERROR:', error);

        document.getElementById('message').innerText =
            'Something went wrong. Check the browser console.';
    });

fetch("https://hook.eu1.make.com/f9m1rk365ggyjwx18vpub35snh3l4x2d", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(response => response.text())
    .then(result => {

        console.log("Make:", result);

        document.getElementById("message").innerText =
            "Appointment received successfully.";

    })
    .catch(error => {

        console.error(error);

        document.getElementById("message").innerText =
            "Appointment submitted successfully.";

    });


}



    
  </script>

</body>
</html>
